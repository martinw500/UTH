<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback — Useful Tool Hub</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Inline and classic on purpose. Reading the stored theme has to happen
         before first paint, or the page flashes the wrong one; and a module
         never runs at all under file://, which the same script reports. -->
    <script>
        (function () {
            if (location.protocol === 'file:') document.documentElement.classList.add('needs-http');
            try {
                var t = localStorage.getItem('uth-theme');
                if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* private mode or file:// */ }
        })();
    </script>
    <script src="js/site.js" defer></script>
</head>
<body>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-brand">
                <div class="nav-logo">U</div>
                <span class="nav-title">Useful Tool Hub</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">Tools</a></li>
                <li><a href="feedback.html" class="nav-link active">Feedback</a></li>
                <li><a href="https://github.com/martinw500/UTH" target="_blank" class="nav-link">GitHub</a></li>
                <li>
                    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme">
                        <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                        <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    </button>
                </li>
            </ul>
                <button type="button" class="nav-toggle" data-nav-toggle
                        aria-expanded="false" aria-controls="navLinks" aria-label="Menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
                    <svg class="nav-toggle-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
        </div>
    </nav>

    <!-- Feedback Page -->
    <main class="tool-page">
        <div class="container tool-page-container" style="max-width: 640px;">

            <!-- Breadcrumb -->
            <div class="breadcrumb">
                <a href="index.html">Home</a>
                <span class="breadcrumb-sep">/</span>
                <span class="breadcrumb-current">Feedback</span>
            </div>

            <div class="feedback-panel">
                <h1>We'd love your feedback</h1>
                <p>Help us improve by sharing your thoughts, suggestions, or reporting issues.</p>

                <div id="messageBox" class="message-box"></div>

                <form id="feedbackForm" action="https://formspree.io/f/xpqqzjdd" method="POST">
                    <div class="form-group">
                        <label for="name">Name (optional)</label>
                        <input type="text" id="name" name="name" placeholder="Your name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email (optional)</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <label for="type">Feedback Type</label>
                        <select id="type" name="type" required>
                            <option value="">Select type...</option>
                            <option value="suggestion">Suggestion</option>
                            <option value="bug">Bug Report</option>
                            <option value="feature">Feature Request</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Your Feedback *</label>
                        <textarea id="message" name="message" required placeholder="Tell us what you think..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Feedback</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-left">&copy; 2026 Useful Tool Hub</div>
            <ul class="footer-links">
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="https://github.com/martinw500/UTH" target="_blank">GitHub</a></li>
            </ul>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('feedbackForm');
            const messageBox = document.getElementById('messageBox');
            const submitBtn = form.querySelector('.btn');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                e.stopPropagation();

                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending...';
                messageBox.classList.remove('active', 'success', 'error');

                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: { 'Accept': 'application/json' }
                    });

                    if (response.ok) {
                        messageBox.textContent = 'Thank you for your feedback! We appreciate your input.';
                        messageBox.classList.add('active', 'success');
                        form.reset();
                    } else {
                        throw new Error('Submission failed');
                    }
                } catch {
                    messageBox.textContent = 'Oops! There was a problem submitting your feedback. Please try again.';
                    messageBox.classList.add('active', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit Feedback';
                }
            });
        });
    </script>
</body>
</html>
