name: CI — Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  validate:
    name: Validate Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # These checks used to be three hand-maintained lists of paths, which had
      # to be edited for every new tool and could not catch a page referencing a
      # script that was never committed — the 404 that commit 085863b fixed.
      # Deriving the file set from git instead means new tools need no CI edit.
      - name: Check core assets exist
        run: |
          for f in index.html styles.css script.js js/config.js vercel.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing file: $f"
              exit 1
            fi
          done
          echo "Core assets present."

      - name: Check every page's scripts and stylesheets exist
        run: |
          fail=0
          for f in $(git ls-files '*.html'); do
            d=$(dirname "$f")
            refs=$(grep -o -e 'src="[^"]*\.js"' -e 'href="[^"]*\.css"' "$f" \
                   | sed -e 's/^src="//' -e 's/^href="//' -e 's/"$//')
            for ref in $refs; do
              case "$ref" in http*|//*) continue ;; esac
              if [ ! -f "$d/$ref" ]; then
                echo "ERROR: $f references missing asset: $ref"
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Every referenced local asset exists."

      - name: Validate vercel.json
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf-8')); console.log('vercel.json is valid JSON')"

      - name: Check for console.error/debugger statements
        run: |
          echo "Checking for leftover debugger statements..."
          if grep -rn "debugger;" --include="*.js" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "WARNING: Found debugger statements"
            exit 1
          fi
          echo "No debugger statements found."

      - name: Validate HTML has required meta tags
        run: |
          fail=0
          for f in $(git ls-files '*.html'); do
            for tag in 'charset="UTF-8"' 'name="viewport"' '<title>'; do
              if ! grep -q "$tag" "$f"; then
                echo "ERROR: $f missing $tag"
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All tracked HTML files have required meta tags."

  e2e:
    name: E2E — Deployed Site
    runs-on: ubuntu-latest
    needs: [test, validate]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # On a PR, test that PR's Vercel preview rather than production, so a
      # regression is caught before it is merged. Needs VERCEL_TOKEN and
      # VERCEL_PROJECT_ID repo secrets; without them the PR run is skipped
      # rather than silently re-testing production and reporting a false pass.
      - name: Resolve Vercel preview URL
        id: preview
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel secrets not configured; skipping preview E2E."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in $(seq 1 20); do
            url=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&state=READY&limit=20" \
              | jq -r --arg sha "$SHA" \
                '.deployments[] | select(.meta.githubCommitSha == $sha) | .url' | head -n1)
            if [ -n "$url" ]; then
              echo "Preview ready: https://$url"
              echo "site=https://$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for preview deployment ($attempt/20)..."
            sleep 15
          done
          echo "No READY preview deployment found for $SHA" >&2
          exit 1

      - name: Wait for Vercel production deploy to settle
        if: github.event_name == 'push'
        run: sleep 30

      - name: Run E2E tests
        if: steps.preview.outputs.skip != 'true'
        env:
          # Empty on push, so the test file falls back to the production URL.
          SITE_URL: ${{ steps.preview.outputs.site }}
        run: npm run test:e2e
